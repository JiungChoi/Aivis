<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1f38"/>
      <stop offset="100%" stop-color="#050b16"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <ellipse cx="256" cy="210" rx="195" ry="165" fill="url(#glow)"/>

  <!-- Layers icon (AIVIS brand) scaled to center -->
  <!-- Top layer polygon -->
  <polygon points="256,100 146,155 256,210 366,155"
    fill="#1e3a6a" stroke="#60a5fa" stroke-width="6" stroke-linejoin="round"/>
  <!-- Middle layer -->
  <polyline points="146,210 256,265 366,210"
    fill="none" stroke="#3b82f6" stroke-width="6"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom layer -->
  <polyline points="146,265 256,320 366,265"
    fill="none" stroke="#2563eb" stroke-width="5"
    stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>

  <!-- Vertical connecting lines -->
  <line x1="146" y1="155" x2="146" y2="265" stroke="#2563eb" stroke-width="3.5" opacity="0.35"/>
  <line x1="366" y1="155" x2="366" y2="265" stroke="#2563eb" stroke-width="3.5" opacity="0.35"/>
  <line x1="256" y1="100" x2="256" y2="210" stroke="#60a5fa" stroke-width="3.5" opacity="0.35"/>

  <!-- Firefly particles -->
  <circle cx="174" cy="136" r="6.5" fill="#60a5fa" opacity="0.82"/>
  <circle cx="338" cy="130" r="5"   fill="#93c5fd" opacity="0.72"/>
  <circle cx="386" cy="222" r="5.5" fill="#60a5fa" opacity="0.62"/>
  <circle cx="127" cy="226" r="6"   fill="#93c5fd" opacity="0.66"/>
  <circle cx="256" cy="82"  r="5"   fill="#bfdbfe" opacity="0.58"/>
  <circle cx="198" cy="342" r="4.5" fill="#60a5fa" opacity="0.42"/>
  <circle cx="312" cy="340" r="4.5" fill="#93c5fd" opacity="0.46"/>
  <circle cx="412" cy="165" r="4"   fill="#60a5fa" opacity="0.36"/>
  <circle cx="100" cy="170" r="4"   fill="#93c5fd" opacity="0.40"/>

  <!-- Apex glow dot -->
  <circle cx="256" cy="100" r="13" fill="#3b82f6" opacity="0.5"/>
  <circle cx="256" cy="100" r="7"  fill="#bfdbfe" opacity="0.92"/>
</svg>
